<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>特洛伊 | 原聲播客與專欄首頁</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>:root{--bg-main:#FFF;--bg-card:#F8FAFC;--text-primary:#0F172A;--text-secondary:#475569;--border-light:#E2E8F0;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Noto Sans TC',sans-serif;background:var(--bg-main);color:var(--text-primary);line-height:1.75;padding-bottom:60px;}.header{border-bottom:1px solid var(--border-light);padding:16px 20px;position:sticky;top:0;background:#FFF;z-index:10;}.inner{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}.container{max-width:860px;margin:0 auto;padding:24px 20px;}.list{display:flex;flex-direction:column;gap:22px;}.card{padding:24px;border:1px solid var(--border-light);border-radius:12px;background:#FFF;box-shadow:0 2px 8px rgba(0,0,0,0.02);transition:border-color 0.2s ease;}.card:hover{border-color:#CBD5E1;}.card-title{font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.45;}.card-title a{color:inherit;text-decoration:none;}.card-title a:hover{color:#2563EB;}.card-hook{font-size:14px;color:var(--text-secondary);margin-bottom:16px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}.pbox{background:var(--bg-card);border:1px solid var(--border-light);border-radius:8px;padding:12px 16px;margin-bottom:16px;}.pctrls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}.play-btn{width:36px;height:36px;border-radius:50%;background:#0F172A;color:#FFF;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background 0.2s;}.play-btn:hover{background:#334155;}.track{width:100%;height:6px;background:#E2E8F0;border-radius:3px;cursor:pointer;margin-top:6px;position:relative;}.fill{height:100%;width:0%;background:#0F172A;border-radius:3px;}.meta-footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#64748B;border-top:1px dashed var(--border-light);padding-top:14px;flex-wrap:wrap;gap:10px;}.meta-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}.meta-item{display:inline-flex;align-items:center;gap:4px;}.read-more-btn{display:inline-flex;align-items:center;gap:4px;color:#2563EB;font-weight:600;text-decoration:none;padding:5px 12px;border:1px solid #BFDBFE;border-radius:16px;background:#EFF6FF;transition:all 0.2s ease;}.read-more-btn:hover{background:#2563EB;color:#FFF;border-color:#2563EB;}</style></head><body><header class="header"><div class="inner"><div style="font-weight:700;">特洛伊 | 微型創業AI賦能師</div><a href="https://rubybranddesign-cloud.github.io/e-line-card-share/troyAIempower/" target="_blank" style="font-size:12px;color:#2563EB;text-decoration:none;padding:5px 14px;border:1px solid #BFDBFE;border-radius:16px;">預約諮詢</a></div></header><main class="container"><div class="list" id="list"></div></main><script>const posts=[{"id":"post_1788785358245","title":"你也忘了怎麼寫字嗎？當滑鼠變成翅膀後的代價 ｜特洛伊AI賦能師","hook":"我對著麥克風，再一次試著喚醒那些沈睡的文字，卻驚覺自己早已忘了如何提筆。面對電腦，日夜開始顛倒，我們在數不盡的深夜裡，用滑鼠編織著別人的劇本，卻在現實與虛擬的交界處，逐漸弄丟了真實的自己。","content_html":"<blockquote><p><strong>【 本文核心摘要 】</strong>：當滑鼠成為數位時代的翅膀，我們在效率中迷失，於深夜裡數落這場「活該」卻無法離不開的創業共業。</p></blockquote>\n\n<p>我坐在麥克風前，再一次錄製，再一次試著對自己說話。</p>\n\n<p>這是一個荒謬的現狀——我發現自己忘了怎麼跟客戶溝通，忘了怎麼跟同事相處，甚至，我忘了怎麼「寫字」。</p>\n\n<p>如果沒有了這台電腦，如果沒辦法打字，我似乎連解釋自己是誰的能力都徹底喪失。</p>\n\n<h3>「滑鼠是我的翅膀，但這雙翅膀卻讓我困在椅子上」</h3>\n\n<p>我對著電腦，看著作業時間與生活節奏開始徹底顛倒。</p>\n\n<p>在這個創立的過程中，我彷彿活在一個永遠不會變老的時空，不需要精緻的武裝，只需要日復一日地坐在這裡。</p>\n\n<p>雖然滑鼠是我的翅膀，帶我飛向數位世界的頂端，但代價卻是長時間久坐，讓屁股偶爾傳來陣陣難耐的癢與僵硬。</p>\n\n<p>這雙翅膀，究竟是讓我自由，還是將我禁錮在桌前？</p>\n\n<h3>「在數不盡的編劇日夜裡，真假早已分不清」</h3>\n\n<p>這數不盡的日夜裡，我像是一個瘋狂編劇，不斷在螢幕後剪輯、產出、運作。</p>\n\n<p>我用真名寫下的話，卻在另一個工作維度裡，變得越來越像是一種虛構的增加。</p>\n\n<p>我活在兩個世界裡，一個是眼前的螢幕，一個是身後的現實，直到最後，我分不清哪一個才是真正的我。</p>\n\n<p>我對著鍵盤敲打，指尖傳來的震動，是我與這世界唯一的聯繫。</p>\n\n<h3>「這是一場活該的共業，那就讓我們一起罵、一起留下來」</h3>\n\n<p>你也跟我一樣嗎？在工作時看似瀟灑，卻在無人的深夜經歷著同樣的自我懷疑？</p>\n\n<p>如果這是一場「活該」的折磨，是因為我們選擇了這條路，那就讓我們一起數落這個現狀吧。</p>\n\n<p>既然已經離不開了，既然這台機器已經成為我們生命的一部分，那就一邊咒罵，一邊繼續戰鬥。</p>\n\n<p>這就是我們這一代創業者的宿命，在忘了怎麼寫字之後，學會用另一種方式，在數位荒原裡刻下痕跡。</p>\n\n<p>如果你也感同身受，請按個愛心或分享給同樣在深夜敲擊鍵盤的朋友。</p>\n\n<p>讓系統為你效勞、讓創業不再過勞！ / 我是特洛伊，一起用ＡＩ守住光陰！</p>","created_at":"2026-09-07T12:46:46.856Z","html_url":"post_1788785358245.html","published_url":"https://alwayslucky2hand-ops.github.io/troypodcatblogpush/post_1788785358245.html","hosted_audio_url":"https://alwayslucky2hand-ops.github.io/troypodcatblogpush/audio/post_1788785358245.webm","audio_stream_url":"https://drive.google.com/uc?export=download&id=1o9mqIOWl8CsuT3umo12v1SsGd6MMPQIc\nhttps://drive.google.com/uc?export=download&id=1EdTrJ_bwrQ5vUu613R5E5Z37b7S4OaZl","audio_duration":0,"metrics":{"views":0,"reads_completed":0,"hearts":0}}];let activeAudio=null,activeId=null;function render(){const c=document.getElementById('list');c.innerHTML='';if(!posts.length){c.innerHTML='<div style="text-align:center;padding:60px 0;color:#94A3B8;">暫無專欄播客節目</div>';return;}posts.forEach(p=>{const it=document.createElement('div');it.className='card';const primaryUrl=p.hosted_audio_url||'';const backupUrl=p.audio_stream_url||(p.audio_files&&p.audio_files[0]?p.audio_files[0].stream_url:'');const initialUrl=primaryUrl||backupUrl;const linkUrl = p.html_url || (p.id ? (p.id + '.html') : (p.published_url || '#'));const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString('zh-TW') : '近期';const views = (p.metrics && p.metrics.views) ? p.metrics.views : 0;const hearts = (p.metrics && p.metrics.hearts) ? p.metrics.hearts : 0;it.innerHTML='<h2 class="card-title"><a href="'+linkUrl+'">'+p.title+'</a></h2><div class="card-hook">'+(p.hook||'')+'</div>'+(initialUrl?'<div class="pbox"><div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;"><span>原聲播客廣播</span><span id="st-'+p.id+'">就緒</span></div><div class="track" onclick="seekA(event,\''+p.id+'\')"><div class="fill" id="bar-'+p.id+'"></div></div><div class="pctrls"><button class="play-btn" id="btn-'+p.id+'" onclick="toggleA(\''+p.id+'\',\''+initialUrl+'\',\''+backupUrl+'\')"><i data-lucide="play" id="ic-'+p.id+'" style="width:16px;height:16px;"></i></button><div style="font-size:12px;color:#64748B;"><span id="cur-'+p.id+'">00:00</span></div><audio id="aud-'+p.id+'" src="'+initialUrl+'" preload="metadata"></audio></div></div>':'')+'<div class="meta-footer"><div class="meta-info">'+'<span class="meta-item"><i data-lucide="user" style="width:13px;height:13px;"></i> 特洛伊</span>'+'<span class="meta-item"><i data-lucide="calendar" style="width:13px;height:13px;"></i> '+dateStr+'</span>'+'<span class="meta-item"><i data-lucide="eye" style="width:13px;height:13px;"></i> 瀏覽 '+views+'</span>'+'<span class="meta-item"><i data-lucide="heart" style="width:13px;height:13px;"></i> 愛心 '+hearts+'</span>'+'</div><a href="'+linkUrl+'" class="read-more-btn">點入閱讀 &rarr;</a></div>';c.appendChild(it);});lucide.createIcons();}function toggleA(id,pri,bak){const a=document.getElementById('aud-'+id);if(!a)return;if(activeAudio&&activeAudio!==a){activeAudio.pause();if(activeId){const oldIc=document.getElementById('ic-'+activeId);if(oldIc)oldIc.setAttribute('data-lucide','play');const oldSt=document.getElementById('st-'+activeId);if(oldSt)oldSt.textContent='暫停';}}if(a.paused){activeAudio=a;activeId=id;bindA(a,id,bak);const p=a.play();if(p!==undefined){p.then(()=>{const ic=document.getElementById('ic-'+id);if(ic)ic.setAttribute('data-lucide','pause');const st=document.getElementById('st-'+id);if(st)st.textContent='播放中';lucide.createIcons();}).catch(err=>{if(bak&&a.src!==bak){a.src=bak;a.load();a.play().catch(()=>{const st=document.getElementById('st-'+id);if(st)st.textContent='載入中斷';});}else{const st=document.getElementById('st-'+id);if(st)st.textContent='播放失敗';}});}}else{a.pause();const ic=document.getElementById('ic-'+id);if(ic)ic.setAttribute('data-lucide','play');const st=document.getElementById('st-'+id);if(st)st.textContent='暫停';lucide.createIcons();}}function bindA(a,id,bak){if(a._b)return;a._b=true;a.ontimeupdate=()=>{const cur=a.currentTime||0,dur=a.duration||1;const bar=document.getElementById('bar-'+id);if(bar)bar.style.width=((cur/dur)*100)+'%';const m=String(Math.floor(cur/60)).padStart(2,'0'),s=String(Math.floor(cur%60)).padStart(2,'0');const t=document.getElementById('cur-'+id);if(t)t.textContent=m+':'+s;};a.onended=()=>{const ic=document.getElementById('ic-'+id);if(ic)ic.setAttribute('data-lucide','play');const st=document.getElementById('st-'+id);if(st)st.textContent='播畢';lucide.createIcons();};a.onerror=()=>{if(bak&&a.src!==bak){a.src=bak;a.load();a.play().catch(()=>{});}else{const st=document.getElementById('st-'+id);if(st)st.textContent='音訊連線異常';}};}function seekA(e,id){const a=document.getElementById('aud-'+id);if(!a||!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration;if(a.paused)toggleA(id,a.src);}render();</script></body></html>
