<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特洛伊 AI 專欄 ｜ 創業者的時間貧窮解放師</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg-main: #FFFFFF; --bg-card: #FAFAFA; --bg-hover: #F0F0F0; --text-primary: #111111; --text-secondary: #555555; --text-muted: #888888; --border-light: #E5E5E5; --radius-default: 8px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-primary); line-height: 1.8; padding: 40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--border-light); padding-bottom: 24px; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 24px; font-weight: 700; }
    .filter-bar { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-default); font-size: 14px; outline: none; }
    .search-input:focus { border-color: var(--text-primary); }
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .post-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-default); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease; text-decoration: none; color: inherit; }
    .post-card:hover { border-color: var(--text-primary); transform: translateY(-2px); }
    .post-title { font-size: 16px; font-weight: 600; line-height: 1.45; margin-bottom: 10px; }
    .post-hook { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .post-footer { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-light); padding-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>特洛伊 AI 專欄</h1>
        <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">創業者的時間貧窮解放師 ｜ 讓系統為你效勞、讓創業不再過勞！</p>
      </div>
      <a href="https://rubybranddesign-cloud.github.io/e-line-card-share/troyAIempower/" target="_blank" style="font-size:13px;color:#2563EB;text-decoration:underline;">預約時間盤點諮詢 &rarr;</a>
    </header>
    <div class="filter-bar">
      <input type="text" class="search-input" id="search-input" placeholder="搜尋文章標題、摘要關鍵字..." oninput="filterPosts(this.value)">
    </div>
    <div class="posts-grid" id="posts-grid"></div>
  </div>
  <script>
    const allPosts = [];
    function renderList(list) {
      const grid = document.getElementById('posts-grid');
      grid.innerHTML = '';
      if (!list || list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888;">暫無相關文章</div>';
        return;
      }
      list.forEach(function(p) {
        const card = document.createElement('a');
        card.className = 'post-card';
        card.href = p.html_url || (p.id + '.html');
        const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString('zh-TW') : '';
        card.innerHTML = '<div><div class="post-title">' + p.title + '</div><div class="post-hook">' + (p.hook || '') + '</div></div><div class="post-footer"><span>' + dateStr + '</span><span>閱讀全文 &rarr;</span></div>';
        grid.appendChild(card);
      });
    }
    function filterPosts(kw) {
      const q = (kw || '').trim().toLowerCase();
      const res = allPosts.filter(function(p) {
        return (p.title || '').toLowerCase().indexOf(q) !== -1 || (p.hook || '').toLowerCase().indexOf(q) !== -1;
      });
      renderList(res);
    }
    renderList(allPosts);
    lucide.createIcons();
  </script>
</body>
</html>
